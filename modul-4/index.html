<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Portfolio Tracker - Modul 4</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, sans-serif;
    }
    body {
      background-color: #f1f5f9;
      color: #0f172a;
      padding: 30px 15px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      padding: 25px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    h1 {
      color: #1e3a8a;
      font-size: 24px;
      margin-bottom: 5px;
    }
    p.subtitle {
      color: #64748b;
      margin-bottom: 20px;
      font-size: 14px;
    }
    /* Style Formulir Input Proyek */
    .form-container {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 25px;
    }
    .form-container h2 {
      font-size: 16px;
      color: #1e3a8a;
      margin-bottom: 15px;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 12px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .form-group label {
      font-size: 12px;
      font-weight: 600;
      color: #475569;
    }
    .form-control {
      padding: 8px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .form-control:focus {
      border-color: #1e3a8a;
    }
    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 15px;
    }
    .checkbox-group label {
      font-size: 13px;
      color: #475569;
      cursor: pointer;
    }
    .btn-submit {
      background: #1e3a8a;
      color: #ffffff;
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background: #1d4ed8;
    }
    /* Style Pencarian & Kartu Statistik */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 25px;
    }
    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 15px;
      text-align: center;
    }
    .stat-card h3 {
      font-size: 13px;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .stat-card p {
      font-size: 20px;
      font-weight: bold;
      color: #1e3a8a;
    }
    .search-box {
      margin-bottom: 15px;
    }
    .search-input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    .search-input:focus {
      border-color: #1e3a8a;
    }
    .filter-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .btn-filter {
      padding: 8px 16px;
      border: 1px solid #cbd5e1;
      background: #ffffff;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s;
    }
    .btn-filter.active, .btn-filter:hover {
      background: #1e3a8a;
      color: #ffffff;
      border-color: #1e3a8a;
    }
    .project-card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #ffffff;
      transition: transform 0.15s ease;
    }
    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }
    .project-info h4 {
      font-size: 16px;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .project-category {
      display: inline-block;
      font-size: 12px;
      color: #0284c7;
      background: #e0f2fe;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
      font-weight: 600;
    }
    .project-budget {
      font-size: 14px;
      color: #334155;
      font-weight: 600;
    }
    .project-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-success {
      background: #dcfce7;
      color: #166534;
    }
    .badge-pending {
      background: #fef9c3;
      color: #854d0e;
    }
    .btn-action {
      padding: 6px 10px;
      border: none;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn-action:hover {
      opacity: 0.85;
    }
    .btn-toggle {
      background: #e2e8f0;
      color: #334155;
    }
    .btn-delete {
      background: #fee2e2;
      color: #991b1b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Portofolio Proyek Interaktif</h1>
    <p class="subtitle">Modul 4: Tugas Mandiri Portfolio Tracker</p>

    <!-- Fitur 1: Form Input Proyek Dinamis -->
    <div class="form-container">
      <h2>Tambah Proyek Baru</h2>
      <form id="project-form">
        <div class="form-grid">
          <div class="form-group">
            <label for="project-title">Judul Proyek</label>
            <input type="text" id="project-title" class="form-control" placeholder="Contoh: Aplikasi E-Commerce" required>
          </div>
          <div class="form-group">
            <label for="project-category">Kategori</label>
            <select id="project-category" class="form-control">
              <option value="Web App">Web App</option>
              <option value="Mobile App">Mobile App</option>
              <option value="Desktop App">Desktop App</option>
              <option value="UI/UX Design">UI/UX Design</option>
            </select>
          </div>
          <div class="form-group">
            <label for="project-budget">Estimasi Anggaran (Rp)</label>
            <input type="number" id="project-budget" class="form-control" placeholder="Contoh: 3000000" min="1" required>
          </div>
        </div>
        <div class="checkbox-group">
          <input type="checkbox" id="project-status">
          <label for="project-status">Proyek Sudah Selesai</label>
        </div>
        <button type="submit" class="btn-submit">Tambah Proyek</button>
      </form>
    </div>

    <!-- Ringkasan Statistik -->
    <div class="stats-grid">
      <div class="stat-card">
        <h3>Total Proyek</h3>
        <p id="stat-total-projects">0</p>
      </div>
      <div class="stat-card">
        <h3>Total Anggaran</h3>
        <p id="stat-total-budget">Rp 0</p>
      </div>
      <div class="stat-card">
        <h3>Selesai Dikerjakan</h3>
        <p id="stat-completed-projects">0</p>
      </div>
    </div>

    <!-- Fitur 2: Pencarian Real-Time & Filter -->
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="Cari nama proyek secara real-time...">
    </div>

    <div class="filter-group">
      <button class="btn-filter active" data-category="Semua">Semua Proyek</button>
      <button class="btn-filter" data-category="Web App">Web App</button>
      <button class="btn-filter" data-category="Mobile App">Mobile App</button>
      <button class="btn-filter" data-category="Desktop App">Desktop App</button>
      <button class="btn-filter" data-category="UI/UX Design">UI/UX Design</button>
    </div>

    <!-- Kontainer Daftar Proyek -->
    <div id="project-list"></div>
  </div>

  <script src="main.js"></script>
</body>
</html>
